# Klaviyo read API as a Grafana Infinity data source.
#
# The key lives in secureJsonData: encrypted at rest, never sent to the browser.
# allowedHosts pins the destination so a malformed dashboard query cannot be
# pointed somewhere else.

apiVersion: 1

deleteDatasources:
  - name: Klaviyo API
    orgId: 1

datasources:
  - name: Klaviyo API
    uid: klaviyo-api
    type: yesoreyeram-infinity-datasource
    access: proxy
    orgId: 1
    isDefault: true
    editable: false
    jsonData:
      allowedHosts:
        - https://a.klaviyo.com
      httpHeaderName1: Authorization
      httpHeaderName2: Accept
      httpHeaderName3: Content-Type
      httpHeaderName4: Revision
      timeoutInSeconds: 30
    secureJsonData:
      httpHeaderValue1: Klaviyo-API-Key ${KLAVIYO_API_KEY}
      httpHeaderValue2: application/vnd.api+json
      httpHeaderValue3: application/vnd.api+json
      httpHeaderValue4: "2026-10-15"
